      summary: Issue an access token from client credentials
      description: 'Issues the access token every other endpoint authenticates with. One grant: `grant_type=client_credentials` — exchanges the `client_id` and `client_secret` created in Settings › Client credentials for an access token. No refresh token is issued. When the token expires, call this endpoint again with the same `client_id` and `client_secret`.'
